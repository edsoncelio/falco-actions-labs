name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Start Falco
        uses: falcosecurity/falco-actions/start@main
        # uses: ./start/
        with:
          mode: analyze
          falco-version: '0.39.0'
          verbose: false
        
      - name: Threats
        run: |
          env | grep "ghu_" || true
          sleep 10
        
      - name: Copy results
        run: |
          docker cp falco:/tmp/falco_events.json /tmp/falco_events.json || true
          docker exec falco ls -la /falco || true
          
      - name: Stop Falco
        uses: ./stop/
        with:
          mode: analyze
          verbose: false

  analyze-foo:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
    - name: Analyze
      uses: falcosecurity/falco-actions/analyze@main
      with:
        falco-version: '0.39.0'
        openai-user-prompt: "Pls add remediation steps"
        openai-model: "gpt-3.5-turbo"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        VT_API_KEY: ${{ secrets.VT_API_KEY }}

